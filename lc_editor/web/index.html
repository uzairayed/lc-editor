<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>lc-editor labels</title>
  <link rel="stylesheet" href="/desk.css" />
</head>
<body>
  <header>
    <div>
      <strong>lc-editor</strong>
      <span class="muted">label desk</span>
    </div>
    <div id="ready" class="pill warn">checking…</div>
    <label class="search">
      <span class="muted">/</span>
      <input id="search" type="search" placeholder="filter filename, role, subject" autocomplete="off" />
    </label>
  </header>
  <nav class="filters" id="filters">
    <button data-filter="unlabeled" class="active">Unlabeled <b id="c-unlabeled">0</b></button>
    <button data-filter="needs_confirmation">Needs confirm <b id="c-needs_confirmation">0</b></button>
    <button data-filter="conflicts">Conflicts <b id="c-conflicts">0</b></button>
    <button data-filter="all">All <b id="c-all">0</b></button>
  </nav>
  <main>
    <aside id="queue" class="pane"></aside>
    <section class="player pane">
      <video id="video" playsinline controls></video>
      <div id="filmstrip" class="filmstrip"></div>
      <div class="transport muted">
        space play · j k l · ← → shot · ↑ ↓ file · 1–9 role · enter confirm · s skip · u undo
      </div>
    </section>
    <section class="inspector pane">
      <div id="inspector"></div>
      <div class="actions">
        <button id="confirm" class="primary">Confirm &amp; next</button>
        <button id="skip">Skip</button>
        <button id="clear">Clear</button>
        <button id="undo">Undo</button>
        <button id="delete" class="danger">Delete</button>
      </div>
      <p id="status" class="muted"></p>
    </section>
  </main>
  <script src="/desk.js"></script>
</body>
</html>
